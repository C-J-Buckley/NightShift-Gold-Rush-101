<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Digging Overlay</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .overlay-frame {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
    }

    .overlay-chrome {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 10;
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      image-rendering: pixelated;
    }

    .overlay-close {
      box-sizing: border-box;
      width: 18px;
      height: 16px;
      border: 1px solid #2a180f;
      box-shadow:
        inset 0 0 0 1px #ffd23f,
        1px 1px 0 #050815;
      background: #8b2d20;
      color: #fff5c6;
      cursor: pointer;
      font: 700 8px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-align: center;
    }

    .overlay-close:hover {
      background: #c44732;
    }

    .overlay-last-update {
      display: none;
    }
  </style>
</head>
<body>
  <div class="overlay-frame" id="overlayFrame">
    <canvas id="overlay" width="1920" height="1080" aria-label="Animated digging overlay"></canvas>
    <div class="overlay-chrome" id="overlayChrome">
      <button class="overlay-close" id="overlayClose" type="button" aria-label="Close overlay">X</button>
      <div class="overlay-last-update" id="overlayLastUpdate">LAST UPDATE --:-- --</div>
    </div>
  </div>

    (() => {

      const operatorXs = Array.from({ length: STATION_COUNT }, (_, i) => {

        const laneRight = PLAY_RIGHT - LANE_EDGE_PADDING;
        if (total <= 1) return Math.round((laneLeft + laneRight) / 2);
        return laneLeft + Math.round(index * (laneRight - laneLeft) / (total - 1));
      }

      const stationXs = Array.from({ length: 13 }, (_, i) => 40 + i * 31);

      const lockerRoster = [

      const lockerByOperator = buildLockerMap(lockerRoster);
      const lockerFullNames = lockerRoster.map(([locker, name]) => [normalizeOperatorName(name), locker]);

      function normalizeOperatorName(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[’]/g, "'")
          .replace(/&/g, " and ")
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function buildLockerMap(roster) {
        const map = new Map();
        const suffixes = new Set(["jr", "sr", "ii", "iii", "iv", "v"]);
        const addAlias = (alias, locker) => {
          const normalized = normalizeOperatorName(alias);
          if (normalized && !map.has(normalized)) map.set(normalized, locker);
        };

        roster.forEach(([locker, name]) => {
          const normalized = normalizeOperatorName(name);
          const parts = normalized.split(" ").filter(Boolean);
          addAlias(name, locker);
          if (parts.length < 2) return;

          let lastNameIndex = parts.length - 1;
          for (let i = parts.length - 1; i > 0; i--) {
            if (!suffixes.has(parts[i])) {
              lastNameIndex = i;
              break;
            }
          }

          const first = parts[0];
          const lastName = parts[lastNameIndex];
          const suffixText = parts.slice(lastNameIndex + 1).join(" ");
          if (lastName) {
            addAlias(`${first} ${lastName[0]}`, locker);
            if (suffixText) addAlias(`${first} ${lastName[0]} ${suffixText}`, locker);
          }
          if (parts.length > 2) {
            addAlias(`${first} ${parts[1][0]}`, locker);
            if (lastName) addAlias(`${parts.slice(0, lastNameIndex).join(" ")} ${lastName[0]}`, locker);
          }
        });

        return map;
      }

      function lockerForOperatorName(name) {
        const normalized = normalizeOperatorName(name);
        if (lockerByOperator.has(normalized)) return lockerByOperator.get(normalized);

        for (const [knownName, locker] of lockerFullNames) {
          if (normalized.includes(knownName)) return locker;
        }
        return null;
      }

      function parseDashboardNumber(value) {
        const match = String(value || "").replace(/,/g, "").match(/-?\d+(?:\.\d+)?/);
        return match ? Number(match[0]) : 0;
      }

      function shiftWindowFor(date) {
        const start = new Date(date);
        start.setHours(22, 30, 0, 0);
        if (date < start) start.setDate(start.getDate() - 1);

        const end = new Date(start);
        end.setHours(end.getHours() + 8);
        return { start, end };
      }

      function productiveElapsedHours(date = new Date()) {
        const { start, end } = shiftWindowFor(date);
        const clamped = new Date(Math.min(Math.max(date.getTime(), start.getTime()), end.getTime()));
        const breaks = [
          { startMin: 120, durationMin: 15 },
          { startMin: 240, durationMin: 30 },
          { startMin: 360, durationMin: 15 },
        ];

        let elapsedMinutes = (clamped - start) / 60000;
        breaks.forEach((breakInfo) => {
          const used = Math.max(0, Math.min(elapsedMinutes - breakInfo.startMin, breakInfo.durationMin));
          elapsedMinutes -= used;
        });

        return Math.max(0.25, Math.min(6.5, elapsedMinutes / 60));
      }

      function projectedHoursFromCurrent(currentHours, evalHours) {
        if (evalHours > currentHours) return evalHours;
        const projected = currentHours / productiveElapsedHours() * 6.5;
        return Math.max(currentHours, Math.min(9.9, projected));
      }

      function headerIndex(headers, names) {
        return headers.findIndex(header => names.some(name => header.includes(name)));
      }

      function tableRows(table) {
        return Array.from(table.querySelectorAll("tr"))
          .map(row => Array.from(row.children).map(cell => cell.textContent.trim()));
      }

      function readDashboardOperators() {
        const root = document.getElementById("operatorGoldRushRoot") || document.getElementById("overlayFrame");
        const tables = Array.from(document.querySelectorAll("table"))
          .filter(table => !root || !root.contains(table));

        for (const table of tables) {
          const rows = tableRows(table).filter(row => row.length);
          if (rows.length < 2) continue;

          const headers = rows[0].map(cell => cell.toLowerCase().replace(/\s+/g, " ").trim());
          const operatorIndex = headerIndex(headers, ["operator"]);
          const collectSessionsIndex = headerIndex(headers, ["collect sessions"]);
          const collectedHoursIndex = headerIndex(headers, ["collected hours"]);
          const evalSessionsIndex = headerIndex(headers, ["eval sessions"]);
          const evalHoursIndex = headerIndex(headers, ["eval hours"]);

          if (operatorIndex < 0 || collectedHoursIndex < 0) continue;

          const liveRows = rows.slice(1)
            .map(row => {
              const locker = lockerForOperatorName(row[operatorIndex]);
              if (!locker) return null;

              const collectSessions = parseDashboardNumber(row[collectSessionsIndex]);
              const evalSessions = parseDashboardNumber(row[evalSessionsIndex]);
              const collectedHours = parseDashboardNumber(row[collectedHoursIndex]);
              const evalHours = parseDashboardNumber(row[evalHoursIndex]);
              const currentHours = collectedHours + evalHours;
              const sessions = collectSessions + evalSessions;

              if (currentHours <= 0 && sessions <= 0) return null;

              return {
                locker,
                currentHours,
                projectedHours: projectedHoursFromCurrent(currentHours, 0),
                sessions,
              };
            })
            .filter(Boolean)
            .sort((a, b) => a.locker - b.locker)
            .slice(0, STATION_COUNT);

          if (liveRows.length) {
            return liveRows.map((op, i) => ({
              ...op,
              x: xForOperatorCount(i, liveRows.length),
            }));
          }
        }

        return [];
      }

      function demoOperatorData() {
        return operatorXs.map((x, i) => {
        const hours = Math.min(5.95, 0.35 + (((i * 7) % STATION_COUNT) / (STATION_COUNT - 1)) * 5.65);
        return {
          x,
          locker: i + 1,
          currentHours: hours,
          projectedHours: Math.max(hours, hours + (((i * 5) % 7) * 0.17)),
          sessions: 8 + ((i * 13) % 35),
        };
        });
      }

      function activeOperatorData() {
        const liveOperators = readDashboardOperators();
        if (liveOperators.length) return liveOperators;
        return IS_PREVIEW_MODE ? demoOperatorData() : [];
      }

      let demoOperators = activeOperatorData();

      const digitMap = {
        "0": ["111", "101", "101", "101", "111"],
        "1": ["010", "110", "010", "010", "111"],
        "2": ["111", "001", "111", "100", "111"],
        "3": ["111", "001", "111", "001", "111"],
        "4": ["101", "101", "111", "001", "001"],
        "5": ["111", "100", "111", "001", "111"],
        "6": ["111", "100", "111", "101", "111"],
        "7": ["111", "001", "001", "010", "010"],
        "8": ["111", "101", "111", "101", "111"],
        "9": ["111", "101", "111", "001", "111"],
      };
      const segmentGlyphs = {
        "0": "abcfed",
        "1": "bc",
        "2": "abged",
        "3": "abgcd",
        "4": "fgbc",
        "5": "afgcd",
        "6": "afgecd",
        "7": "abc",
        "8": "abcdefg",
        "9": "abfgcd",
        "S": "afgcd",
        "H": "fgebc",
        "P": "abfge",
      };

      function rgba(color, alphaScale = 1) {
        const a = Math.max(0, Math.min(255, Math.round(color[3] * alphaScale))) / 255;
        return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${a})`;
      }

      function rect(x, y, w, h, color, alphaScale = 1) {
        ctx.fillStyle = rgba(color, alphaScale);
        ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
      }

      function oval(cx, cy, rx, ry, color, alphaScale = 1) {
        ctx.fillStyle = rgba(color, alphaScale);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      function lineRect(x1, y1, x2, y2, color, alphaScale = 1) {
        const x = Math.min(x1, x2);
        const y = Math.min(y1, y2);
        rect(x, y, Math.abs(x2 - x1) + 1, Math.abs(y2 - y1) + 1, color, alphaScale);
      }

      function drawText(text, x, y, color, size = 6) {
        ctx.fillStyle = rgba(color);
        ctx.font = `${size}px monospace`;
        ctx.textBaseline = "top";
        ctx.fillText(text, x, y);
      }

      function drawOutlinedText(text, x, y, color, size = 4) {
        ctx.save();
        ctx.font = `${size}px monospace`;
        ctx.textBaseline = "top";
        ctx.fillStyle = rgba([2, 3, 8, 235]);
        ctx.fillText(text, x + 1, y + 1);
        ctx.fillStyle = rgba(color);
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawCenteredOutlinedText(text, cx, y, color, size = 3) {
        ctx.save();
        ctx.font = `${size}px monospace`;
        ctx.textBaseline = "top";
        const x = Math.round(cx - ctx.measureText(text).width / 2);
        ctx.fillStyle = rgba([2, 3, 8, 235]);
        ctx.fillText(text, x + 1, y + 1);
        ctx.fillStyle = rgba(color);
        ctx.fillText(text, x, y);
        ctx.restore();
      }

      function drawSegmentChar(ch, x, y, color, alpha = 1) {
        if (ch === ".") {
          rect(x, y + 5, 1, 1, color, alpha);
          return 2;
        }
        if (ch === "#") {
          rect(x, y + 1, 1, 4, color, alpha);
          rect(x + 2, y + 1, 1, 4, color, alpha);
          rect(x, y + 2, 3, 1, color, alpha);
          rect(x, y + 4, 3, 1, color, alpha);
          return 4;
        }

        const segments = segmentGlyphs[ch];
        if (!segments) return 2;
        const dim = [36, 48, 72, 255];
        const drawSeg = (id, active) => {
          const segColor = active ? color : dim;
          const segAlpha = active ? alpha : 0.22;
          if (id === "a") rect(x + 1, y, 2, 1, segColor, segAlpha);
          if (id === "b") rect(x + 3, y + 1, 1, 2, segColor, segAlpha);
          if (id === "c") rect(x + 3, y + 4, 1, 2, segColor, segAlpha);
          if (id === "d") rect(x + 1, y + 6, 2, 1, segColor, segAlpha);
          if (id === "e") rect(x, y + 4, 1, 2, segColor, segAlpha);
          if (id === "f") rect(x, y + 1, 1, 2, segColor, segAlpha);
          if (id === "g") rect(x + 1, y + 3, 2, 1, segColor, segAlpha);
        };

        ["a", "b", "c", "d", "e", "f", "g"].forEach(id => drawSeg(id, segments.includes(id)));
        return 5;
      }

      function segmentTextWidth(text) {
        return text.split("").reduce((sum, ch) => sum + (ch === "." ? 2 : ch === "#" ? 4 : segmentGlyphs[ch] ? 5 : 2), 0) - 1;
      }

      function drawSegmentText(text, x, y, color) {
        let cursor = x;
        for (const ch of text) {
          cursor += drawSegmentChar(ch, cursor, y, color);
        }
      }

      function drawCenteredSegmentText(text, cx, y, color) {
        const x = Math.round(cx - segmentTextWidth(text) / 2);
        drawSegmentText(text, x + 1, y + 1, [2, 3, 8, 235]);
        drawSegmentText(text, x, y, color);
      }

      function drawCenteredTvText(text, cx, y, color, size = 3) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = `900 ${Math.round(size * SCALE)}px "Arial Narrow", "Aptos Narrow", Arial, sans-serif`;
        ctx.textBaseline = "top";
        const x = Math.round(cx * SCALE - ctx.measureText(text).width / 2);
        const py = Math.round(y * SCALE);
        ctx.fillStyle = rgba([2, 3, 8, 245]);
        ctx.fillText(text, x + 2, py + 2);
        ctx.fillText(text, x - 2, py + 2);
        ctx.fillStyle = rgba(color);
        ctx.fillText(text, x, py);
        ctx.restore();
      }

      function drawTvText(text, x, y, color, size = 4) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = `900 ${Math.round(size * SCALE)}px "Arial Narrow", "Aptos Narrow", Arial, sans-serif`;
        ctx.textBaseline = "top";
        const px = Math.round(x * SCALE);
        const py = Math.round(y * SCALE);
        ctx.fillStyle = rgba([2, 3, 8, 245]);
        ctx.fillText(text, px + 2, py + 2);
        ctx.fillText(text, px - 2, py + 2);
        ctx.fillStyle = rgba(color);
        ctx.fillText(text, px, py);
        ctx.restore();
      }

      function tvTextWidth(text, size = 4) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.font = `900 ${Math.round(size * SCALE)}px "Arial Narrow", "Aptos Narrow", Arial, sans-serif`;
        const width = ctx.measureText(text).width / SCALE;
        ctx.restore();
        return width;
      }

      function drawLeaderboard() {

          rect(badgeX - 1, badgeY - 1, badgeW + 2, badgeH + 2, [2, 3, 8, 210]);

          rect(badgeX, badgeY, badgeW, 1, medal.edge, 0.95);
          rect(badgeX, badgeY + badgeH - 1, badgeW, 1, medal.shade, 0.95);
          rect(badgeX, badgeY, 1, badgeH, medal.edge, 0.75);
          rect(badgeX + badgeW - 1, badgeY, 1, badgeH, medal.shade, 0.75);

          drawCenteredTvText(badgeText, badgeX + badgeW / 2, badgeTextY, rankColor, badgeTextSize);
        });

        rect(x + 5, y + 16, w - 10, 1, [255, 244, 116, 90]);

      function tinyDigit(ch, x, y, color) {
        const rows = digitMap[ch];
        for (let yy = 0; yy < rows.length; yy++) {
          for (let xx = 0; xx < rows[yy].length; xx++) {
            if (rows[yy][xx] === "1") rect(x + xx, y + yy, 1, 1, color);
          }
        }
      }

      function lockerLabel(num, cx, y) {
        const text = String(num).padStart(2, "0");
        rect(cx - 5, y, 11, 8, [3, 4, 12, 248]);
        lineRect(cx - 5, y, cx + 5, y, num % 2 ? C.gold : C.cyan);
        lineRect(cx - 5, y + 7, cx + 5, y + 7, num % 2 ? C.gold : C.cyan);
        lineRect(cx - 5, y, cx - 5, y + 7, num % 2 ? C.gold : C.cyan);
        lineRect(cx + 5, y, cx + 5, y + 7, num % 2 ? C.gold : C.cyan);
        tinyDigit(text[0], cx - 3, y + 2, C.cream);
        tinyDigit(text[1], cx + 1, y + 2, C.cream);
      }

      function random01(seed) {
        const n = Math.sin(seed * 12.9898) * 43758.5453;
        return n - Math.floor(n);
      }

      function clamp01(value) {
        return Math.max(0, Math.min(1, value));
      }

      function easeOutCubic(value) {
        const t = clamp01(value);
        return 1 - Math.pow(1 - t, 3);
      }

      function drawImpactBurst(cx, cy, phase, color = C.goldLight) {
        const alpha = 1 - clamp01(phase);
        const reach = 2 + Math.floor(phase * 5);
        rect(cx, cy - reach, 1, reach + 1, color, alpha);
        rect(cx, cy, 1, reach + 1, color, alpha);
        rect(cx - reach, cy, reach + 1, 1, color, alpha);
        rect(cx, cy, reach + 1, 1, color, alpha);
        rect(cx - reach + 1, cy - reach + 1, 1, 1, C.cream, alpha * 0.85);
        rect(cx + reach - 1, cy - reach + 1, 1, 1, C.cream, alpha * 0.85);
        rect(cx - reach + 1, cy + reach - 1, 1, 1, C.gold, alpha * 0.8);
        rect(cx + reach - 1, cy + reach - 1, 1, 1, C.gold, alpha * 0.8);
      }

      function introDigProgress(t, index) {
        const elapsed = t - animationStart - index * INTRO_DIG_STAGGER;
        return easeOutCubic(elapsed / INTRO_DIG_SECONDS);
      }

      function visibleHoursForOperator(op, index, t) {
        return op.currentHours * introDigProgress(t, index);
      }

      function toolForHours(hours) {
        if (hours >= 4) return "drill";
        if (hours > 2) return "shovel";
        return "pickaxe";
      }

      function stationMarker(n, x, y) {
        const outline = n % 2 ? C.blue : C.red;
        const shine = n % 2 ? C.cyan : C.pink;
        rect(x, y, 18, 9, [4, 4, 12, 250]);

        rect(x, y + 8, 18, 1, outline);
        rect(x, y, 1, 9, outline);
        rect(x + 17, y, 1, 9, outline);
        rect(x + 1, y + 1, 16, 1, shine);
        rect(x + 6, y + 3, 6, 3, [60, 65, 78, 255]);
      }

      function dirtRect(x1, y1, x2, y2, y0 = HUD_H + 1) {
        for (let y = y1; y <= y2; y += 10) {
          rect(x1, y, x2 - x1 + 1, Math.min(10, y2 - y + 1), earth[Math.floor((y - y0) / 10) % earth.length]);

      }

      function drawPlayfieldDirt() {
        const x1 = 0;
        const x2 = W - 1;
        const y1 = HUD_H + 1;
        const y2 = LOWER_DIRT_TOP + 1;
        for (let y = y1; y <= y2; y += 10) {
          const color = earth[Math.floor((y - y1) / 10) % earth.length];
          rect(x1, y, x2 - x1 + 1, Math.min(10, y2 - y + 1), color);
        }

        for (let i = 0; i < 520; i++) {
          const x = x1 + Math.floor(random01(i + 301) * (x2 - x1 + 1));
          const y = y1 + Math.floor(random01(i + 307) * (y2 - y1 + 1));
          const colors = earth.concat([C.earthDark, [210, 143, 54, 255], [92, 63, 34, 255]]);
          const size = [1, 1, 1, 2][Math.floor(random01(i + 313) * 4)];
          rect(x, y, size, size, colors[Math.floor(random01(i + 317) * colors.length)]);
        }
      }

      function drawDugTunnels(t) {
        demoOperators.forEach((op, i) => {
          const x = op.x;
          const visibleHours = visibleHoursForOperator(op, i, t);
          const y = Math.round(yForHours(visibleHours));
          const progress = clamp01(visibleHours / GOLD_HOURS);
          const top = START_Y + 6 + Math.floor(random01(i + 1510) * 4);
          const bottom = Math.max(top + 5, Math.min(FLOOR_Y + 1, y + 7));
          const left = x - DUG_TUNNEL_HALF;
          const right = x + DUG_TUNNEL_HALF;

          for (let col = 0; col < DUG_TUNNEL_WIDTH; col += 3) {
            const segW = Math.min(3, DUG_TUNNEL_WIDTH - col);
            const segBottom = Math.max(top + 4, bottom - Math.floor(random01(i * 1600 + col) * 5));
            rect(left + col, top, segW, segBottom - top + 1, [20, 11, 12, 246]);
            if (col >= 2 && col <= DUG_TUNNEL_WIDTH - 5) {
              rect(left + col, top, segW, segBottom - top + 1, [2, 3, 8, 188]);
            }
          }

          for (let cap = 0; cap < DUG_TUNNEL_WIDTH; cap += 2) {
            const topChip = 1 + Math.floor(random01(i * 1700 + cap) * 4);
            const bottomChip = 1 + Math.floor(random01(i * 1800 + cap) * 4);
            const chipColor = earth[Math.floor(random01(i * 1900 + cap) * earth.length)];
            if (random01(i * 2000 + cap) > 0.25) rect(left + cap, top, 2, topChip, chipColor, 0.82);
            if (random01(i * 2100 + cap) > 0.32) rect(left + cap, bottom - bottomChip + 1, 2, bottomChip, chipColor, 0.72);
          }

          // Uneven edge pixels make the cleared dirt read as a dug tunnel.
          for (let yy = top + 3; yy < bottom; yy += 8) {
            const leftChip = random01(i * 1000 + yy) > 0.45 ? 1 : 0;
            const rightChip = random01(i * 1000 + yy + 17) > 0.5 ? 1 : 0;
            if (leftChip) rect(left - 1, yy, 2, 3, [82, 45, 22, 150]);
            if (rightChip) rect(right, yy + 2, 2, 3, [82, 45, 22, 150]);
            if (random01(i * 1000 + yy + 31) > 0.68) rect(left + 3, yy + 1, 2, 1, [114, 63, 28, 90]);
            if (random01(i * 1000 + yy + 47) > 0.72) rect(right - 4, yy + 4, 2, 1, [114, 63, 28, 80]);
          }

          // Active digging front: loose dirt disappears at the sprite's feet.
          const dustPulse = 0.55 + 0.35 * Math.sin(t * 8 + i);
          if (progress < 1 || introDigProgress(t, i) < 1) {
            rect(left + 1, bottom + 1, 3, 1, [210, 143, 54, 210], dustPulse);
            rect(right - 3, bottom + 2, 3, 1, [255, 220, 64, 170], dustPulse);
            rect(x - 2, bottom + 3, 4, 1, [184, 116, 44, 180], dustPulse);

            for (let p = 0; p < 7; p++) {
              const life = (t * 0.75 + i * 0.137 + p * 0.173) % 1;
              const dir = p % 2 === 0 ? -1 : 1;
              const spread = 2 + life * (3 + (p % 3));
              const lift = Math.sin(life * Math.PI) * (5 + (p % 2) * 2);
              const fall = life * life * 5;
              const px = x + dir * spread + Math.floor(random01(i * 701 + p * 19) * 3) - 1;
              const py = bottom + 2 - lift + fall + Math.floor(random01(i * 727 + p * 23) * 2);
              const particleColor = [
                [210, 143, 54, 220],
                [184, 116, 44, 220],
                [112, 77, 35, 230],
                [255, 220, 64, 170],
              ][p % 4];
              const size = life < 0.32 ? 2 : 1;
              rect(px, py, size, size, particleColor, 0.25 + (1 - life) * 0.75);
            }
          }
        });
      }

      function drawCloud(x, y, scale, alpha = 1) {

        rect(x, y + 7 * scale, 31 * scale, 4 * scale, white, alpha);

        for (let i = 0; i < 50; i++) {

        const cx = W / 2;

        rect(0, GOLD_BED_TOP + 9, W, GOLD_BED_BOTTOM - GOLD_BED_TOP - 8, [66, 37, 15, 255]);
        for (let x = 0; x < W; x += 6) {

          if (random01(x + 102) > 0.58) rect(x + 1, y + 1, Math.max(2, w - 2), 1, [255, 205, 42, 100]);

      function activeCutIn() {

      function cutInsReady(t) {

      function rankedOperators(t) {
        return demoOperators
          .map((op, i) => ({ op, i, visibleHours: visibleHoursForOperator(op, i, t) }))
          .sort((a, b) => {
            return (b.visibleHours - a.visibleHours)
              || (b.op.sessions - a.op.sessions)
              || (a.op.locker - b.op.locker);
          });
      }

      function startOvertakeCelebration(t) {
        const ranked = rankedOperators(t);
        const order = ranked.map(item => item.op.locker);

        if (!previousOvertakeOrder) {
          previousOvertakeOrder = order;
          return;
        }

        const previousRank = new Map(previousOvertakeOrder.map((locker, rank) => [locker, rank]));
        const currentByLocker = new Map(ranked.map((item, rank) => [item.op.locker, { ...item, rank }]));

        ranked.forEach((item, currentRank) => {
          const oldRank = previousRank.get(item.op.locker);
          if (oldRank === undefined || oldRank <= currentRank) return;

          ranked.slice(currentRank + 1).forEach((other) => {
            const oldOtherRank = previousRank.get(other.op.locker);
            if (oldOtherRank === undefined || oldOtherRank >= oldRank) return;
            const key = `${item.op.locker}-${other.op.locker}`;
            if (!celebratedOvertakes.has(key)) {
              pendingOvertakes.set(key, {
                locker: item.op.locker,
                passedLocker: other.op.locker,
                firstSeen: t,
                rankGain: oldRank - currentRank,
              });
            }
          });
        });

        previousOvertakeOrder = order;

        if (!cutInsReady(t)) {
          return;
        }
        if (activeCutIn() || t - lastOvertakeCelebrationEnd < OVERTAKE_CELEBRATION_COOLDOWN_SECONDS) return;

        let best = null;
        pendingOvertakes.forEach((pending, key) => {
          const item = currentByLocker.get(pending.locker);
          const passed = currentByLocker.get(pending.passedLocker);
          if (!item || !passed || item.rank >= passed.rank || t - pending.firstSeen > 120) {
            pendingOvertakes.delete(key);
            return;
          }

          const margin = item.visibleHours - passed.visibleHours;
          if (item.visibleHours < OVERTAKE_MIN_HOURS || margin < OVERTAKE_LEAD_HOURS) return;

          const candidate = {
            op: item.op,
            passed: passed.op,
            visibleHours: item.visibleHours,
            passedHours: passed.visibleHours,
            margin,
            rankGain: pending.rankGain,
            key,
          };
          if (!best || candidate.rankGain > best.rankGain || candidate.margin > best.margin) best = candidate;
        });

        if (!best && IS_PREVIEW_MODE && !previewOvertakeShown) {
          const ready = ranked.filter(item => item.visibleHours >= OVERTAKE_MIN_HOURS);
          if (ready.length >= 2) {
            const item = ready[0];
            const passed = ready[1];
            const naturalMargin = item.visibleHours - passed.visibleHours;
            best = {
              op: item.op,
              passed: passed.op,
              visibleHours: item.visibleHours,
              passedHours: passed.visibleHours,
              margin: Math.max(OVERTAKE_LEAD_HOURS, Math.min(0.48, naturalMargin)),
              rankGain: 1,
              key: "__preview_overtake__",
            };
          }
        }

        if (!best) return;

        if (best.key === "__preview_overtake__") {
          previewOvertakeShown = true;
        } else {
          pendingOvertakes.delete(best.key);
          celebratedOvertakes.add(best.key);
        }
        currentOvertakeCelebration = {
          ...best,
          start: t,
          end: t + OVERTAKE_CELEBRATION_SECONDS,
        };
      }

      function drawCelebrationConfetti(t, alpha) {
        const colors = [C.goldLight, C.gold, C.cyan, C.cream, C.pink];
        for (let i = 0; i < 72; i++) {
          const seed = i * 31;
          const lane = random01(seed + 1);
          const cycle = (t * (0.18 + random01(seed + 2) * 0.12) + random01(seed + 3)) % 1;
          const drift = Math.sin((cycle + random01(seed + 4)) * Math.PI * 2) * (10 + random01(seed + 5) * 14);
          const x = 24 + lane * (W - 48) + drift;
          const y = 42 + cycle * 160;
          const w = 1 + Math.floor(random01(seed + 6) * 3);
          const h = 2 + Math.floor(random01(seed + 7) * 4);
          const color = colors[Math.floor(random01(seed + 8) * colors.length)];
          const flip = Math.floor(t * 7 + i) % 2 === 0;
          const pieceAlpha = alpha * (0.45 + (1 - cycle) * 0.5);

          rect(x, y, flip ? w : h, flip ? h : w, [2, 3, 8, 170], pieceAlpha * 0.45);
          rect(x, y, flip ? w : h, flip ? h : w, color, pieceAlpha);
          if (i % 9 === 0) drawImpactBurst(Math.round(x), Math.round(y), (cycle * 2) % 1, color);
        }

          rect(x, y, 14 - i, 2, i % 2 ? C.cyan : C.goldLight, 0.34);

      function drawOvertakeCelebration(t) {
        if (currentOvertakeCelebration && t >= currentOvertakeCelebration.end) {
          lastOvertakeCelebrationEnd = t;
          currentOvertakeCelebration = null;
        }

        startOvertakeCelebration(t);
        if (!currentOvertakeCelebration) return false;

        const celebration = currentOvertakeCelebration;
        const progress = clamp01((t - celebration.start) / OVERTAKE_CELEBRATION_SECONDS);
        const alpha = Math.min(1, progress * 5, (1 - progress) * 5);
        const rawMinutesAhead = Math.max(1, Math.round(celebration.margin * 60));
        const minutesAhead = Math.min(rawMinutesAhead, OVERTAKE_MAX_CALLOUT_MINUTES);
        const minutesLabel = `+${minutesAhead} MINS`;

        rect(0, 0, W, H, [2, 3, 8, 232], alpha);
        rect(18, 42, W - 36, 164, [5, 8, 24, 242], alpha);
        rect(18, 42, W - 36, 3, C.cyan, alpha);
        rect(18, 203, W - 36, 3, [46, 25, 17, 255], alpha);
        rect(20, 45, W - 40, 1, [255, 244, 116, 170], alpha);
        drawCelebrationConfetti(t - celebration.start, alpha);

        drawCenteredTvText("Digging Ahead!", W / 2, 54, C.goldLight, 13);
        drawCenteredTvText(`#${celebration.op.locker}`, W / 2, 84, C.cream, 18);
        drawCenteredTvText(`PASSED #${celebration.passed.locker}`, W / 2, 112, C.cyan, 6);
        drawCenteredTvText(`${celebration.visibleHours.toFixed(1)}H CURRENT`, W / 2, 125, C.cream, 5);
        drawCenteredTvText(minutesLabel, W / 2, 136, C.gold, 5);
        drawOvertakeScene(W / 2, 181, t, progress);
        return true;
      }

      function drawImageMinerSprite(cx, y, idx, frame, state, toolType, locker) {
        if (!USE_IMAGE_SPRITES) return false;
        if (!minerSpriteSheetLoaded) return true;

        const frameName = state === "climb" ? "idle" : (state === "victory" ? "idle" : toolType);
        const sprite = minerImageFrames[frameName] || minerImageFrames.pickaxe;
        const bob = state === "victory" ? (frame % 2 === 0 ? -1 : 1) : [0, 0, 1, 0][frame % 4];
        const drawH = state === "victory" ? 26 : 28;
        const drawW = drawH * (sprite.sw / sprite.sh);
        const footY = Math.round(y) + bob;
        const dx = Math.round(Math.max(0, Math.min(W - drawW, cx - drawW * sprite.anchorX)));
        const dy = Math.round(footY + 11 - drawH);

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(minerSpriteSheet, sprite.sx, sprite.sy, sprite.sw, sprite.sh, dx, dy, drawW, drawH);
        ctx.restore();

        return true;
      }

      function minerSprite(cx, y, idx, frame, depth, state = "dig", toolType = "pickaxe", locker = idx + 1) {
        const helmet = helmets[idx % helmets.length];
        const suit = suits[Math.floor(idx / 2) % suits.length];
        const hi = highlights[Math.floor(idx / 2) % highlights.length];
        const face = skinTones[idx % skinTones.length];
        const faceShade = skinShades[idx % skinShades.length];
        const hair = hairColors[(idx + Math.floor(idx / 5)) % hairColors.length];
        const glove = gloveColors[(idx + 1) % gloveColors.length];
        const belt = beltColors[idx % beltColors.length];
        const scarf = idx % 3 === 0 ? C.goldLight : (idx % 3 === 1 ? C.cream : C.cyan);
        const swing = frame % 4;
        const bob = state === "victory" ? (frame % 2 === 0 ? -1 : 1) : [0, 0, 1, 0][swing];
        const footY = Math.round(y) + bob;
        const U = SCALE * 0.88;
        const sx = Math.round(cx * SCALE);
        const sy = Math.round(footY * SCALE);

        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        function px(x) {
          return sx + x * U;
        }

        function py(y) {
          return sy + y * U;
        }

        function fillOval(x, y, rx, ry, color, alphaScale = 1) {
          ctx.fillStyle = rgba(color, alphaScale);
          ctx.beginPath();
          ctx.ellipse(px(x), py(y), rx * U, ry * U, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        function fillRound(x, y, w, h, r, color, alphaScale = 1) {
          ctx.fillStyle = rgba(color, alphaScale);
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(px(x), py(y), w * U, h * U, r * U);
          } else {
            const x0 = px(x);
            const y0 = py(y);
            const width = w * U;
            const height = h * U;
            const radius = r * U;
            ctx.moveTo(x0 + radius, y0);
            ctx.lineTo(x0 + width - radius, y0);
            ctx.quadraticCurveTo(x0 + width, y0, x0 + width, y0 + radius);
            ctx.lineTo(x0 + width, y0 + height - radius);
            ctx.quadraticCurveTo(x0 + width, y0 + height, x0 + width - radius, y0 + height);
            ctx.lineTo(x0 + radius, y0 + height);
            ctx.quadraticCurveTo(x0, y0 + height, x0, y0 + height - radius);
            ctx.lineTo(x0, y0 + radius);
            ctx.quadraticCurveTo(x0, y0, x0 + radius, y0);
          }
          ctx.fill();
        }

        function fillLine(x1, y1, x2, y2, width, color, alphaScale = 1) {
          ctx.strokeStyle = rgba(color, alphaScale);
          ctx.lineWidth = width * U;
          ctx.beginPath();
          ctx.moveTo(px(x1), py(y1));
          ctx.lineTo(px(x2), py(y2));
          ctx.stroke();
        }

        function fillDot(x, y, radius, color, alphaScale = 1) {
          fillOval(x, y, radius, radius, color, alphaScale);
        }

        fillOval(0, 8.2, 7.2, 1.5, C.shadow);

        // Smooth arcade mascot silhouette, drawn at native canvas resolution.
        fillRound(-5.5, 1.6, 4.6, 7.1, 1.3, C.black);
        fillRound(0.9, 1.6, 4.6, 7.1, 1.3, C.black);
        fillRound(-4.6, 2.1, 2.8, 5.5, 1.1, suit);
        fillRound(2.1, 2.1, 2.8, 5.3, 1.1, suit);
        fillRound(-6.4, 6.8, 6.5, 2.4, 1.0, C.boot);
        fillRound(0.8, 6.8, 6.5, 2.4, 1.0, C.boot);
        fillRound(-5.1, 7.0, 3.2, 0.8, 0.4, [72, 72, 82, 255]);
        fillRound(2.1, 7.0, 3.2, 0.8, 0.4, [72, 72, 82, 255]);

        fillRound(-6.5, -9.4, 13.0, 12.7, 2.7, C.black);
        fillRound(-5.5, -8.4, 11.0, 10.7, 2.2, suit);
        fillRound(-5.4, -8.3, 2.0, 8.7, 1.0, hi);
        fillRound(3.4, -8.3, 2.0, 8.7, 1.0, hi);
        fillLine(-2.6, -8.0, -1.5, 1.3, 0.55, C.cream, 0.95);
        fillLine(2.6, -8.0, 1.5, 1.3, 0.55, C.cream, 0.95);
        fillRound(-2.7, -8.5, 5.4, 2.2, 1.0, scarf);
        fillOval(0, -5.0, 2.5, 2.1, [255, 245, 198, 205]);
        fillRound(-5.5, -0.4, 11.0, 1.8, 0.7, belt);
        fillDot(0, 0.4, 0.45, C.goldLight);

        fillOval(0, -13.4, 5.2, 5.1, C.black);
        fillOval(0, -13.6, 4.4, 4.3, face);
        fillOval(-3.6, -14.0, 1.1, 2.9, hair);
        fillOval(3.6, -14.0, 1.1, 2.9, hair);
        fillRound(-3.0, -17.0, 6.0, 1.8, 0.9, hair, 0.72);
        fillDot(-1.7, -14.1, 0.45, C.black);
        fillDot(1.7, -14.1, 0.45, C.black);
        fillOval(1.3, -11.8, 1.6, 0.7, faceShade, 0.82);
        fillOval(0, -10.7, 2.2, 0.6, faceShade, 0.75);

        fillOval(0, -20.1, 6.3, 4.2, C.black);
        fillOval(0, -20.3, 5.5, 3.5, helmet);
        fillRound(-6.6, -18.6, 13.2, 2.4, 1.0, C.black);
        fillRound(-6.1, -18.8, 12.2, 1.9, 0.9, helmet);
        fillRound(-2.3, -23.4, 4.6, 1.8, 0.8, C.black);
        fillDot(0, -23.5, 0.8, C.goldLight, frame % 2 ? 0.55 : 1);
        fillOval(-3.5, -21.6, 1.9, 0.55, C.goldLight, 0.55);
        fillOval(3.9, -21.6, 1.4, 0.5, hi, 0.65);

        if (state === "victory") {
          fillLine(-5.5, -8.0, -7.8, -13.3, 1.7, face);
          fillLine(5.5, -8.0, 7.8, -13.3, 1.7, face);
          fillDot(-8.2, -13.8, 1.25, glove, frame % 2 ? 0.7 : 1);
          fillDot(8.2, -13.8, 1.25, glove, frame % 2 ? 1 : 0.7);
          fillLine(-2.2, -3.9, 2.2, -3.9, 0.8, C.goldLight, 0.9);
          fillDot(0, 10.4, 0.75, C.gold, frame % 2 ? 0.45 : 0.9);
          ctx.restore();
          return;
        }

        const toolColor = toolType === "drill" ? C.cyan : (swing < 2 ? C.goldLight : C.cream);
        const impact = toolType === "drill" || swing === 1 || swing === 3;
        const lift = impact ? 1.6 : -2.0;
        const toolBottom = impact ? 9.0 : 5.4;
        const shake = toolType === "drill" && frame % 2 === 0 ? -0.35 : 0.35;

        // Downward digging pose: tools strike into the soil below the sprite.
        fillLine(-5.5, -7.0, -2.2, -0.8 + lift, 1.7, suit);
        fillLine(5.5, -7.0, 2.2, -0.8 + lift, 1.7, suit);
        fillDot(-2.2, -0.8 + lift, 1.05, glove);
        fillDot(2.2, -0.8 + lift, 1.05, glove);

        if (toolType === "drill") {
          fillRound(-3.5 + shake, -3.4 + lift, 7.0, 6.0, 1.5, [54, 61, 76, 255]);
          fillRound(-2.5 + shake, -2.6 + lift, 5.0, 4.2, 1.1, toolColor);
          fillRound(-1.4 + shake, 1.3 + lift, 2.8, 3.2, 0.9, C.goldLight);
          fillLine(0 + shake, 4.0 + lift, 0 + shake, 10.0, 1.1, C.goldLight);
          fillDot(0 + shake, 10.4, 1.0, [255, 220, 64, 230]);
          fillDot(-1.9 + shake, 6.4, 0.55, C.cyan, 0.9);
          fillDot(2.0 + shake, 7.2, 0.55, C.cyan, frame % 2 ? 0.45 : 0.9);
        } else if (toolType === "shovel") {
          fillLine(0, -9.0 + lift, 0, toolBottom, 0.85, [126, 75, 34, 255]);
          fillDot(0, -0.4 + lift, 0.85, glove);
          fillOval(0, toolBottom + 1.5, 3.1, 2.0, [54, 61, 76, 255]);
          fillOval(0, toolBottom + 0.8, 2.0, 0.6, C.cream);
          if (!impact) fillOval(0, -9.9 + lift, 2.4, 1.0, [54, 61, 76, 255], 0.8);
        } else {
          fillLine(0, -10.0 + lift, 0, toolBottom, 0.85, [126, 75, 34, 255]);
          fillDot(0, -0.6 + lift, 0.85, glove);
          fillLine(-3.0, toolBottom + 0.2, 3.0, toolBottom + 0.2, 0.95, toolColor);
          fillLine(-2.1, toolBottom - 1.0, -2.1, toolBottom + 1.5, 0.85, toolColor);
          fillLine(2.1, toolBottom - 1.0, 2.1, toolBottom + 1.5, 0.85, toolColor);
        }

        const dustAlpha = 0.5 + 0.3 * Math.sin(depth * Math.PI * 2 + idx);
        fillOval(-3.5 + (idx % 3), 10.4, 1.1, 0.45, [210, 143, 54, 180], dustAlpha);
        fillDot(2.3 - (idx % 2), 11.2, 0.45, [255, 220, 64, 150], dustAlpha);
        if (impact) {
          fillOval(-3.1, 8.6, 1.15, 0.45, [255, 220, 64, 220]);
          fillDot(0.2, 9.4, 0.5, [210, 143, 54, 230]);
          fillOval(3.3, 8.8, 1.15, 0.45, [184, 116, 44, 230]);
          if (toolType === "drill") {
            fillDot(-1.6, 7.0, 0.5, C.cyan, frame % 2 ? 0.5 : 1);
            fillDot(1.8, 7.8, 0.45, C.goldLight);
          }
        }

        ctx.restore();
      }

      function drawMiners(t) {
        demoOperators.forEach((op, i) => {
          const x = op.x;
          const visibleHours = visibleHoursForOperator(op, i, t);
          const climb = climbProgressForHours(visibleHours);
          const y = yForOperatorStage(visibleHours);
          const frame = Math.floor(t * TOOL_ANIMATION_FPS + i) % 4;
          const state = climb > 0 ? "climb" : (visibleHours >= GOLD_HOURS ? "victory" : "dig");
          const toolType = toolForHours(visibleHours);
          if (!drawImageMinerSprite(x, y, i, frame, state, toolType, op.locker)) {
            const depth = clamp01(visibleHours / GOLD_HOURS);
            minerSprite(x, y, i, frame, depth, state, toolType, op.locker);
          }
        });
      }

      function drawFrame(now) {
        const t = now / 1000;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
        ctx.imageSmoothingEnabled = false;

        drawStatic(t);
        drawDugTunnels(t);
        drawMoleEncounters(t);
        drawVictoryLadders(t);
        drawSparkles(t);
        drawGoldSparkles(t);
        drawHourMarkers(t);
        drawMiners(t);
        drawVictoryChests(t);
        drawStatsPanel();
        drawOvertakeCelebration(t);

        requestAnimationFrame(drawFrame);
      }

      requestAnimationFrame(drawFrame);
    })();
  </script>
</body>
